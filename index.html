.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(360px 300px at 5% 2%,rgba(1,5,12,.62) 0%,rgba(1,5,12,.4) 34%,rgba(1,5,12,.12) 58%,transparent 78%),radial-gradient(620px 275px at 7% -3%,rgba(0,153,255,.15),transparent 70%),linear-gradient(to bottom,rgba(1,9,20,.05) 0 24%,rgba(1,7,15,.28) 38%,rgba(1,7,15,.64) 58%,rgba(1,7,15,.82) 100%)}
.hero,.stage,.editor-bar,.editor-footer{position:relative;z-index:2}
.hero{height:132px;display:flex;justify-content:center}
.brand{width:var(--grid-w);position:relative;padding:24px 0 0 42px;isolation:isolate}
.orbit{position:absolute;left:-20px;top:-20px;width:126px;height:126px;border-radius:50%;background:radial-gradient(ellipse at 72% 48%,rgba(13,27,50,.94) 0 37%,rgba(3,9,20,.99) 65%,#01040a 100%);box-shadow:-18px 0 26px -6px rgba(180,255,255,.9),-30px 0 50px -10px rgba(24,157,255,.78),-10px 0 78px -16px rgba(70,90,255,.5);z-index:-1}
.orbit::before{content:"";position:absolute;inset:-4px;border-radius:50%;border-left:2px solid rgba(191,252,255,.6);border-top:1.5px solid rgba(69,222,255,.24);border-bottom:1.5px solid rgba(95,68,255,.26);filter:blur(7.5px) drop-shadow(-6px 0 14px rgba(150,240,255,.5)) drop-shadow(-15px 0 30px rgba(45,160,255,.42));-webkit-mask:linear-gradient(90deg,#000 0 38%,rgba(0,0,0,.9) 56%,rgba(0,0,0,.22) 77%,transparent 94%);mask:linear-gradient(90deg,#000 0 38%,rgba(0,0,0,.9) 56%,rgba(0,0,0,.22) 77%,transparent 94%)}
.orbit::after{content:"";position:absolute;left:-6px;top:56px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.8),0 0 12px rgba(105,239,255,.5),0 0 24px rgba(23,140,255,.36);filter:blur(.4px)}
.brand::before{content:"";position:absolute;left:-34px;top:65px;width:540px;height:5px;border-radius:50%;background:linear-gradient(90deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.62) 6%,rgba(214,255,255,.5) 12%,rgba(69,226,255,.34) 24%,rgba(35,133,255,.16) 46%,rgba(36,78,255,.04) 74%,transparent 100%);box-shadow:0 0 12px rgba(160,240,255,.4),0 0 26px rgba(51,166,255,.24);filter:blur(2.5px);opacity:.9}
.brand::after{content:"";position:absolute;left:-34px;top:66.5px;width:200px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.85) 0%,rgba(220,255,255,.55) 30%,transparent 100%);filter:blur(.4px)}
.brand strong{display:block;width:max-content;font-family:"Segoe UI Light","Helvetica Neue",Arial,sans-serif;font-size:39px;font-weight:300;line-height:1;letter-spacing:.15em;background:linear-gradient(90deg,#ffffff 0%,#f5fcff 20%,#e2f6ff 38%,#c9ecff 52%,#bfe0ff 64%,#c4d8ff 80%,#d3d3ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 3px rgba(255,255,255,.5)) drop-shadow(0 0 12px rgba(170,220,255,.45))}
.brand small{display:block;margin:15px 0 0 2px;color:#cfe0f2;font-size:8.5px;font-weight:700;letter-spacing:.4em;text-shadow:0 0 8px rgba(150,210,255,.3)}
.stage{padding-bottom:54px}
.app-grid{width:var(--grid-w);margin:0 auto;display:grid;grid-template-columns:repeat(8,var(--slot-w));gap:var(--gap-y) var(--gap-x);align-content:start}
.slot{position:relative;width:var(--slot-w);height:var(--slot-h)}
.placeholder{visibility:hidden}
.hide-empty .slot:has(.empty-slot){visibility:hidden}
.app-link{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;position:relative;transition:transform .15s ease,filter .15s ease}
.app-link:hover{transform:translateY(-2px);z-index:50;filter:brightness(1.04)}
.icon-shell{width:82px;height:82px;display:grid;place-items:center;border-radius:17px;border:1px solid rgba(70,110,145,.3);background:linear-gradient(145deg,rgba(9,28,44,.98),rgba(3,11,20,.96));box-shadow:0 9px 20px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.08),0 0 14px rgba(28,139,220,.06)}
.app-link img,.glyph{width:68px;height:68px;border-radius:14px}
.app-link img{object-fit:var(--fit,cover)}
.glyph{display:grid;place-items:center;color:#fff;font-family:Arial,sans-serif;font-size:32px;font-weight:760;background:radial-gradient(circle at 34% 23%,rgba(255,255,255,.30),transparent 32%),linear-gradient(145deg,var(--color),#08101f);box-shadow:0 7px 14px rgba(0,0,0,.54),inset 0 1px 0 rgba(255,255,255,.26),0 0 14px var(--color)}
.app-name{margin:6px 0 0;width:100%;font-size:10px;font-weight:760;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 5px #000}
.no-label .app-name{display:none}
.app-description{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,-2px);width:max-content;max-width:210px;padding:9px 12px;margin:0;border:1px solid rgba(80,150,195,.4);border-radius:11px;background:rgba(5,16,28,.86);backdrop-filter:blur(10px);color:#e7eff6;font-size:11px;line-height:1.35;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 18px rgba(60,190,255,.14),inset 0 1px 0 rgba(255,255,255,.06);opacity:0;visibility:hidden;transition:.16s ease;overflow:hidden;z-index:90}
.app-description::before{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75) 20%,rgba(140,225,255,.85) 50%,rgba(180,150,255,.7) 80%,transparent)}
.app-link:hover .app-description{opacity:1;visibility:visible;transform:translate(-50%,0)}
.app-description::after{content:"";position:absolute;left:50%;bottom:-4.5px;width:8px;height:8px;background:rgba(5,16,28,.86);border-right:1px solid rgba(80,150,195,.4);border-bottom:1px solid rgba(80,150,195,.4);transform:translateX(-50%) rotate(45deg)}
.empty-slot{width:82px;height:82px;margin:auto;display:block;border:1px dashed rgba(94,143,190,.38);border-radius:17px;background:rgba(2,9,18,.16);color:#7e8fa3;font-size:31px;cursor:pointer}
.edit-badge{position:absolute;z-index:52;top:-5px;right:13px;width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(123,196,239,.78);border-radius:50%;background:#061521;color:#fff;font-size:9px;pointer-events:none;box-shadow:0 4px 11px rgba(0,0,0,.55),0 0 9px rgba(80,200,255,.4)}
.editor-bar{position:absolute;top:19px;right:max(44px,calc((100vw - var(--grid-w))/2));display:flex;align-items:center;gap:5px;padding:4px;border:1px solid rgba(80,170,220,.38);border-radius:10px;background:rgba(3,13,23,.83);backdrop-filter:blur(12px);box-shadow:0 8px 22px rgba(0,0,0,.38),0 0 16px rgba(40,150,220,.14)}
.editor-bar label,.editor-bar button{height:31px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(67,114,154,.43);border-radius:7px;background:rgba(7,19,32,.72);color:#d7e2ec;font-size:8.5px;font-weight:760;padding:0 10px;cursor:pointer}
.editor-bar .accent{color:#39eef0;border-color:rgba(25,181,201,.72)}
.editor-bar .tool-icon{width:14px;height:14px;flex:0 0 14px;display:inline-flex;align-items:center;justify-content:center;line-height:0}
.editor-bar .tool-icon svg,.share-button svg{display:block;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.editor-bar input[type=checkbox]{appearance:none;-webkit-appearance:none;width:14px;height:14px;flex:0 0 14px;margin:0;border:1px solid rgba(101,187,230,.64);border-radius:3px;background:#071727;display:grid;place-items:center}
.editor-bar input[type=checkbox]:checked{background:#2387ee;border-color:#45aaff}
.editor-bar input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:10px;font-weight:800;line-height:1}
.editor-footer{position:fixed;left:49px;right:48px;bottom:34px;z-index:5;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.edit-mode{font-size:18px;font-weight:800;letter-spacing:.02em;text-shadow:0 2px 8px #000}
.share-button{pointer-events:auto;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(8,16,31,.66);color:#fff;cursor:pointer;box-shadow:0 7px 20px rgba(0,0,0,.38),inset 0 0 0 1px rgba(90,127,183,.2),0 0 12px rgba(60,180,255,.16)}
.share-button svg{width:21px;height:21px;stroke-width:1.5}
.status{position:fixed;z-index:120;top:12px;left:50%;transform:translateX(-50%)}
.status:not(:empty){padding:8px 12px;border:1px solid rgba(74,211,223,.45);border-radius:8px;background:rgba(4,27,36,.94);color:#c8fffa;font-size:12px}
.dragging{opacity:.42}.drop-target .empty-slot{border-style:solid;border-color:#4eeaff;color:#fff}

/* Editor dialog, kept clear and practical */
dialog{width:min(900px,calc(100% - 44px));padding:0;border:1px solid rgba(72,157,214,.62);border-radius:15px;background:linear-gradient(160deg,rgba(8,26,44,.995),rgba(3,12,22,.995));color:#f6f9fc;box-shadow:0 34px 100px rgba(0,0,0,.88)}
dialog::backdrop{background:rgba(0,4,10,.80);backdrop-filter:blur(4px)}
dialog form{padding:24px 30px}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.dialog-head p{margin:0 0 7px;color:#4ff1e9;font-size:13px;font-weight:750;letter-spacing:.12em}
.dialog-head h2{margin:0;font-size:31px;line-height:1.1;font-weight:650}
.close-button{width:38px;height:38px;padding:0;border:0;border-radius:8px;background:transparent;color:#9fb1c5;font-size:29px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 190px;column-gap:20px;row-gap:16px;align-items:start}
.form-grid label,.icon-box>span{color:#b9c8d8;font-size:13px;font-weight:700}
.form-grid input{display:block;width:100%;height:48px;margin-top:8px;padding:0 14px;border:1px solid rgba(78,140,193,.52);border-radius:8px;background:#051323;color:#fff;font-size:17px;outline:none}
.form-grid input:focus{border-color:#46dfef;box-shadow:0 0 0 2px rgba(70,223,239,.08)}
.wide{grid-column:1/3}
.icon-box{grid-column:3;grid-row:1/4;display:flex;flex-direction:column;align-items:center}
.icon-box>span{white-space:nowrap;text-align:center;margin:0 0 10px}
.icon-drop-zone{width:145px;height:174px;margin:0 auto;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px dashed rgba(92,156,207,.62);border-radius:12px;background:rgba(6,19,32,.84);color:#fff;cursor:pointer}
.icon-drop-zone #iconPreview{width:100px;height:100px;display:grid;place-items:center;border-radius:14px;background:#102d43;font-size:44px;color:#42e8ed}
.icon-drop-zone img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.upload-copy{width:100%;text-align:center;font-size:10px;color:#b8c8d8;white-space:nowrap}
#iconFile{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important;opacity:0!important;pointer-events:none!important}
.crop-controls{width:145px;margin:10px auto 0;padding:8px;border:1px solid rgba(75,137,184,.28);border-radius:9px}
.crop-controls label{display:block;margin:5px 0;font-size:10px}
.crop-controls input{height:auto;margin:2px 0;padding:0}
.dialog-options{display:flex;align-items:center;gap:28px;margin-top:20px}
.dialog-options label{display:flex;align-items:center;gap:9px;color:#e1e8ef;font-size:14px;font-weight:720}
.dialog-options input{width:17px;height:17px;margin:0;accent-color:#1683ff}
.helper{margin:12px 0 0;color:#8fa3b8;font-size:12px;line-height:1.45}
.dialog-actions{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;margin-top:20px}
.dialog-actions button{height:48px;padding:0 24px;border:1px solid #38678d;border-radius:9px;background:#081a2a;color:white;font-size:16px;font-weight:750;cursor:pointer}
.dialog-actions .save{background:#246ee0;border-color:#3b8cff}.dialog-actions .danger{color:#ff8495;border-color:#8b2840;background:#250914}

        slot.innerHTML =
          (teacherMode ? '<span class="edit-badge" aria-hidden="true">✎</span>' : '') +
          '<a class="app-link ' + (app.showLabel ? '' : 'no-label') + '" style="--color:' + escapeHtml(app.color) + '" href="' + escapeHtml(app.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(app.name) + '">' +
          '<span class="icon-shell">' + iconMarkup(app) + '</span>' +
          '<p class="app-name">' + escapeHtml(app.name) + '</p>' + tooltip + '</a>';

        if (teacherMode) {
          slot.draggable = true;
          (function (position, currentSlot) {
            currentSlot.querySelector('.app-link').addEventListener('click', function (event) {
              event.preventDefault();
              openDialog(position);
            });
            addDragHandlers(currentSlot, position);
          })(p, slot);
        }
      } else if (teacherMode) {
        slot.innerHTML = '<button class="empty-slot" type="button" aria-label="Add app">＋</button>';
        (function (position, currentSlot) {
          currentSlot.querySelector('button').addEventListener('click', function () { openDialog(position); });
          addDropOnlyHandlers(currentSlot, position);
        })(p, slot);
      }
      grid.appendChild(slot);
    }
  }

  function addDragHandlers(slot, position) {
    slot.addEventListener('dragstart', function () {
      draggedPosition = position;
      slot.classList.add('dragging');
    });
    slot.addEventListener('dragend', function () {
      draggedPosition = null;
      slot.classList.remove('dragging');
      clearDropTargets();
    });
    addDropOnlyHandlers(slot, position);
  }

  function addDropOnlyHandlers(slot, position) {
    slot.addEventListener('dragover', function (event) {
      if (draggedPosition && !appAt(position)) {
        event.preventDefault();
        slot.classList.add('drop-target');
      }
    });
    slot.addEventListener('dragleave', function () { slot.classList.remove('drop-target'); });
    slot.addEventListener('drop', function (event) {
      event.preventDefault();
      slot.classList.remove('drop-target');
      if (!draggedPosition || appAt(position)) return;
      var moving = appAt(draggedPosition);
      if (!moving) return;
      moving.position = position;
      saveApps();
      render();
      flash('Moved to slot ' + position + '.');
    });
  }

  function clearDropTargets() {
    var targets = document.querySelectorAll('.drop-target');
    for (var i = 0; i < targets.length; i++) targets[i].classList.remove('drop-target');
  }

  function setPreview(src) {
    var preview = document.getElementById('iconPreview');
    if (!preview) return;
    preview.innerHTML = src ? '<img src="' + escapeHtml(src) + '" alt="">' : '＋';
  }

  function openDialog(position) {
    if (!teacherMode || !dialog || !form) return;
    var app = appAt(position);
    form.reset();
    cropBitmap = null;
    document.getElementById('position').value = String(position);
    document.getElementById('dialogEyebrow').textContent = 'APP SETTINGS · SLOT ' + position;
    document.getElementById('dialogTitle').textContent = app ? 'Edit App' : 'Add App';
    document.getElementById('deleteButton').hidden = !app;
    document.getElementById('name').value = app ? app.name : '';
    document.getElementById('url').value = app ? app.url : '';
    document.getElementById('description').value = app ? app.description : '';
    document.getElementById('icon').value = app && app.iconType === 'image' ? app.icon : '';
    document.getElementById('fallbackIcon').value = app && app.iconType === 'text' ? app.icon : '+';
    document.getElementById('showLabelField').checked = app ? app.showLabel : true;
    document.getElementById('showDescriptionField').checked = app ? app.showDescription : true;
    document.getElementById('visible').checked = app ? app.visible : true;
    document.getElementById('fit').value = app ? app.fit : 'cover';
    document.getElementById('cropControls').hidden = true;
    setPreview(document.getElementById('icon').value);
    dialog.showModal();
  }

  function useImageFile(file) {
    if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) {
      flash('Choose a PNG, JPG, or WebP image.');
      return;
    }
    if (window.createImageBitmap) {
      window.createImageBitmap(file).then(function (bitmap) {
        cropBitmap = bitmap;
        document.getElementById('cropZoom').value = '100';
        document.getElementById('cropX').value = '0';
        document.getElementById('cropY').value = '0';
        renderCrop();
      }).catch(function () { useFileReaderFallback(file); });
    } else {
      useFileReaderFallback(file);
    }
  }

  function useFileReaderFallback(file) {
    var reader = new FileReader();
    reader.onload = function () {
      document.getElementById('icon').value = String(reader.result || '');
      setPreview(document.getElementById('icon').value);
    };
    reader.onerror = function () { flash('Could not read image.'); };
    reader.readAsDataURL(file);
  }

  function renderCrop() {
    if (!cropBitmap) return;
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = 512;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var zoom = Number(document.getElementById('cropZoom').value) || 100;
    var xControl = Number(document.getElementById('cropX').value) || 0;
    var yControl = Number(document.getElementById('cropY').value) || 0;
    var base = Math.max(512 / cropBitmap.width, 512 / cropBitmap.height);
    var scale = base * zoom / 100;
    var width = cropBitmap.width * scale;
    var height = cropBitmap.height * scale;
    var maxX = Math.max(0, (width - 512) / 2);
    var maxY = Math.max(0, (height - 512) / 2);
    var x = (512 - width) / 2 - (xControl / 100) * maxX;
    var y = (512 - height) / 2 - (yControl / 100) * maxY;
    ctx.drawImage(cropBitmap, x, y, width, height);
    var data = canvas.toDataURL('image/webp', 0.88);
    document.getElementById('icon').value = data;
    setPreview(data);
    document.getElementById('cropControls').hidden = false;
  }

  function setupTeacher() {
    if (!teacherMode || !dialog || !form) return;

    document.getElementById('closeDialog').addEventListener('click', function () { dialog.close(); });
    document.getElementById('cancelButton').addEventListener('click', function () { dialog.close(); });
    document.getElementById('iconDropZone').addEventListener('click', function () { document.getElementById('iconFile').click(); });
    document.getElementById('iconFile').addEventListener('change', function (event) {
      useImageFile(event.target.files && event.target.files[0]);
      event.target.value = '';
    });
    dialog.addEventListener('paste', function (event) {
      var items = event.clipboardData && event.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf('image/') === 0) {
          event.preventDefault();
          useImageFile(items[i].getAsFile());
          break;
        }
      }
    });
    ['cropZoom', 'cropX', 'cropY'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', renderCrop);
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var position = Number(document.getElementById('position').value);
      var old = appAt(position);
      var image = document.getElementById('icon').value.trim();
      var name = document.getElementById('name').value.trim();
      var item = {
        id: old ? old.id : ('app-' + Date.now()),
        position: position,
        name: name || 'App',
        url: document.getElementById('url').value.trim() || '#',
        description: document.getElementById('description').value.trim(),
        icon: image || document.getElementById('fallbackIcon').value || (name.charAt(0) || 'A'),
        iconType: image ? 'image' : 'text',
        showLabel: document.getElementById('showLabelField').checked,
        showDescription: document.getElementById('showDescriptionField').checked,
        visible: document.getElementById('visible').checked,
        fit: document.getElementById('fit').value,
        color: old ? old.color : '#24547a'
      };
      apps = apps.filter(function (a) { return a.position !== position; });
      apps.push(item);
      saveApps();
      render();
      dialog.close();
      flash('Saved.');
    });

    document.getElementById('deleteButton').addEventListener('click', function () {
      var position = Number(document.getElementById('position').value);
      apps = apps.filter(function (a) { return a.position !== position; });
      saveApps();
      render();
      dialog.close();
      flash('Deleted.');
    });

    var showEmptyControl = document.getElementById('showEmpty');
    if (showEmptyControl && !showEmptyControl.checked) grid.classList.add('hide-empty');
    showEmptyControl.addEventListener('change', function (event) {
      if (event.target.checked) grid.classList.remove('hide-empty');
      else grid.classList.add('hide-empty');
    });

    document.getElementById('resetButton').addEventListener('click', function () {
      if (!window.confirm('Reset all apps to the initial layout?')) return;
      apps = clone(initialApps);
      saveApps();
      render();
      flash('Reset.');
    });

    document.getElementById('exportButton').addEventListener('click', function () {
      try {
        var blob = new Blob([JSON.stringify(apps.slice().sort(function (a, b) { return a.position - b.position; }), null, 2)], {type:'application/json'});
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'learning-lab-apps.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.setTimeout(function () { URL.revokeObjectURL(link.href); }, 500);
      } catch (error) {
        flash('Export failed.');
      }
    });

    function fetchTextWithRetry(fileUrl, filename, attemptsLeft) {
      attemptsLeft = attemptsLeft == null ? 4 : attemptsLeft;
      var bust = (fileUrl.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now() + Math.random().toString(36).slice(2);
      return fetch(fileUrl + bust, {cache:'no-store'}).then(function (r) {
        if (!r.ok) throw new Error(filename + ' (' + r.status + ')');
        return r.text();
      }).catch(function (err) {
        if (attemptsLeft <= 1) throw err;
        return new Promise(function (resolve) { window.setTimeout(resolve, 1100); })
          .then(function () { return fetchTextWithRetry(fileUrl, filename, attemptsLeft - 1); });
      });
    }

    var exportHtmlButton = document.getElementById('exportHtmlButton');
    if (exportHtmlButton) {
      exportHtmlButton.addEventListener('click', function () {
        flash('HTMLを作成しています…（うまくいかない場合は自動で再試行します）', 3000);
        // Resolve siblings relative to this document's actual location (handles any path/query robustly).
        var indexUrl = new URL('index.html', document.baseURI).href;
        var cssUrl = new URL('style.css', document.baseURI).href;
        var jsUrl = new URL('app.js', document.baseURI).href;
        Promise.all([
          fetchTextWithRetry(indexUrl, 'index.html'),
          fetchTextWithRetry(cssUrl, 'style.css'),
          fetchTextWithRetry(jsUrl, 'app.js')
        ]).then(function (results) {
          var htmlTemplate = results[0];
          var cssText = results[1];
          var jsText = results[2];
          var sortedApps = apps.slice().sort(function (a, b) { return a.position - b.position; });
          var dataScript = '<script>window.__LL_EMBEDDED_APPS__ = ' + JSON.stringify(sortedApps) + ';</' + 'script>';

          var output = htmlTemplate.replace(/<link rel="stylesheet"[^>]*>/, '<style>' + cssText + '</style>');
          output = output.replace(/<script src="app\.js[^"]*"><\/script>/, dataScript + '<script>' + jsText + '</' + 'script>');
          output = '<!-- LEARNING LAB 生徒配布用スナップショット / exported ' + new Date().toISOString().slice(0, 10) + ' -->\n' + output;

          var blob = new Blob([output], {type:'text/html'});
          var link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'learning-lab-student-' + new Date().toISOString().slice(0, 10) + '.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.setTimeout(function () { URL.revokeObjectURL(link.href); }, 500);
          flash('HTMLをダウンロードしました。');
        }).catch(function (error) {
          console.error('Student HTML export failed:', error);
          var reason = (error && error.message) ? error.message : String(error);
          flash('作成できませんでした（原因: ' + reason + '）。電波の良い場所でもう一度お試しください。', 5200);
        });
      });
    }


    var shareButton = document.getElementById('shareButton');
    if (shareButton) {
      shareButton.addEventListener('click', function () {
        var studentUrl = window.location.href.replace(/editor\.html(?:[?#].*)?$/i, '');
        if (navigator.share) {
          navigator.share({title:'LEARNING LAB', url:studentUrl}).catch(function () {});
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(studentUrl).then(function(){ flash('Student URL copied.'); }).catch(function(){ flash('Could not copy URL.'); });
        } else {
          window.prompt('Student URL', studentUrl);
        }
      });
    }

    document.getElementById('importButton').addEventListener('click', function () { document.getElementById('importFile').click(); });
    document.getElementById('importFile').addEventListener('change', function (event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var imported = sanitize(JSON.parse(String(reader.result || '')));
          if (!imported.length) throw new Error('No valid apps');
          apps = imported;
          saveApps();
          render();
          flash('JSON imported.');
        } catch (error) {
          flash('Invalid JSON. Existing data was kept.');
        }
      };
      reader.onerror = function () { flash('Could not read JSON.'); };
      reader.readAsText(file);
    });
  }

  // Student view must also reflect edits saved in Editor view.
  // A distributed standalone file carries its own embedded snapshot instead.
  if (!EMBEDDED_APPS) {
    loadSavedApps();
  }

  // The top screen is rendered independently. Editor-only failures cannot blank the launcher.
  try {
    render();
  } catch (error) {
    console.error('Launcher render error:', error);
    apps = clone(initialApps);
    try { render(); } catch (secondError) { console.error(secondError); }
  }

  if (teacherMode) {
    try {
      setupTeacher();
    } catch (error) {
      console.error('Editor setup error:', error);
      flash('Launcher is available. Some editor controls could not start.');
    }
  }

  } catch (fatalError) {
    console.error('LEARNING LAB fatal error:', fatalError);
    try {
      var box = document.createElement('div');
      box.style.cssText = 'position:relative;z-index:5;color:#ffb4b4;background:#1a0505;border:1px solid #ff6b6b;padding:16px 18px;border-radius:10px;margin:24px;font-family:monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;max-width:640px';
      box.textContent = 'LEARNING LAB でエラーが発生しました。\nこの画面をスクリーンショットして送ってください。\n\n' + (fatalError && fatalError.message ? fatalError.message : String(fatalError)) + (fatalError && fatalError.stack ? '\n\n' + fatalError.stack : '');
      var host = document.querySelector('.stage') || document.body;
      host.appendChild(box);
    } catch (displayError) {
      console.error('Could not display fatal error:', displayError);
    }
  }
}());
</script></body></html>
